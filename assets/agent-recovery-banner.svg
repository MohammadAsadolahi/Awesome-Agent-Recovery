<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Awesome Agent Recovery</title>
  <desc id="desc">A research-to-production guide for AI agent failure recovery: detect, diagnose, recover, verify, and resume. Illustrated as five connected steps on a dark navy technical banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071423"/><stop offset=".52" stop-color="#0d2340"/><stop offset="1" stop-color="#102e3d"/></linearGradient>
    <linearGradient id="type" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8edbf7"/><stop offset=".55" stop-color="#8cc5ff"/><stop offset="1" stop-color="#b7b0ff"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#49dfc4"/><stop offset=".58" stop-color="#6db8ff"/><stop offset="1" stop-color="#aa9bff"/></linearGradient>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#8cc5ff" opacity=".22"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="45"/></filter>
  </defs>
  <rect width="1280" height="640" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="640" fill="url(#dots)"/>
  <circle cx="1168" cy="140" r="240" fill="#365fcf" opacity=".16" filter="url(#glow)"/>
