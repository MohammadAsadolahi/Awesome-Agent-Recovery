  <text x="70" y="607" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1.1" fill="#86a6bc">GITHUB.COM/MOHAMMADASADOLAHI/AWESOME-AGENT-RECOVERY</text>
