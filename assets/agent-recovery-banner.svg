  <path d="M1042 238V265M1042 326V353M985 295H1012M1072 295H1099" stroke="#67dcd0" stroke-width="4" stroke-linecap="round" opacity=".65"/>
  <circle cx="1042" cy="295" r="9" fill="#80e2cf"/>
  <rect x="70" y="64" width="282" height="34" rx="17" fill="#21465a" stroke="#387c89" stroke-opacity=".6"/>
  <circle cx="88" cy="81" r="5" fill="#65e5ce"/>
