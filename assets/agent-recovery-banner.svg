    <circle cx="1091" cy="487" r="22" fill="#332f58" stroke="#b5a6ff" stroke-width="4"/><text x="1091" y="493" font-size="16" fill="#f4ebff">5</text><text x="1091" y="543" font-size="16" fill="#eee6ff">RESUME</text>
