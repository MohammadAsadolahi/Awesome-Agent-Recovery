  <text x="70" y="207" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="71" fill="#ffffff">Awesome</text>
  <text x="70" y="295" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="84" fill="url(#type)">Agent Recovery</text>
  <text x="73" y="349" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="25" fill="#b7cfe5">From failing tool calls to verified recovery.</text>
  <text x="73" y="387" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="18" fill="#88adc9">Research papers  ·  Benchmarks  ·  Frameworks  ·  Engineering playbooks</text>
  <rect x="70" y="440" width="1140" height="125" rx="23" fill="#081a2c" stroke="#356080" stroke-opacity=".85" stroke-width="1.5"/>
