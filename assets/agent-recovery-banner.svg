    <circle cx="183" cy="487" r="22" fill="#123e43" stroke="#66e1c7" stroke-width="4"/><text x="183" y="493" font-size="16" fill="#ccffef">1</text><text x="183" y="543" font-size="16" fill="#d9eee9">DETECT</text>
    <circle cx="410" cy="487" r="22" fill="#163b54" stroke="#78d2e7" stroke-width="4"/><text x="410" y="493" font-size="16" fill="#e2fcff">2</text><text x="410" y="543" font-size="16" fill="#dceefa">DIAGNOSE</text>
